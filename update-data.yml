# Save this at .github/workflows/update-data.yml
name: Update ETU fantasy data

on:
  schedule:
    # Times are UTC. Adjust if you want different local hours.
    - cron: "0 12 * * *"   # ~7am ET daily — picks up overnight waiver results
    - cron: "0 4 * * 2"    # Tuesday ~midnight ET — after Monday Night Football
  workflow_dispatch:        # lets you refresh on demand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install espn_api

      - name: Fetch league data
        run: python fetch_leagues.py

      - name: Commit if changed
        run: |
          git config user.name "etu-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%FT%TZ)"
          git push
